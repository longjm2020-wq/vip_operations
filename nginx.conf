map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  resolver_timeout 5s;
  # Keep old open pages able to load Excel after a release removes their chunk.
  # Only ExcelJS aliases receive this fallback; other missing assets stay 404.
  location ~ ^/assets/exceljs\.min-[A-Za-z0-9_-]+\.js$ {
    try_files $uri /vendor/exceljs-compat.js =404;
    default_type text/javascript;
    add_header Cache-Control "no-store" always;
  }
  location = /vendor/exceljs-compat.js {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }
  location /vendor/exceljs/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /api/v1/projects/uploads {
    client_max_body_size 70m;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass http://$api_upstream;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/style-selections/import(?:/preview)?/?$ {
    client_max_body_size 200m;
    error_page 413 = @selection_import_too_large;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass http://$api_upstream;
    proxy_connect_timeout 5s;
    proxy_read_timeout 610s;
    proxy_send_timeout 610s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location @selection_import_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"导入请求内容超过大小上限，请拆分文件后重试"}}';
  }
  location /api/ {
    client_max_body_size 8m;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass http://$api_upstream;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
