name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.13
        env: {POSTGRES_USER: erp, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: vip_erp}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U erp -d vip_erp" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://localhost:5173
      VIP_MODE: disabled
      FFMPEG_BIN: /usr/bin/ffmpeg
      PLAYWRIGHT_BROWSERS_PATH: /opt/xuti-ci-playwright
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated CI database
        run: |
          node -e 'const u=new URL("postgresql:"+"//localhost:5432/vip_erp");u.username="erp";require("fs").appendFileSync(process.env.GITHUB_ENV,"DATABASE_URL="+u.toString()+"\n")'
      - uses: pnpm/action-setup@v4
        with: {version: 10.32.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24.21.0, cache: pnpm}
      - name: Install system media tools
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg
          "$FFMPEG_BIN" -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Install Playwright Chromium with the Linux sandbox
        run: |
          download_dir="$RUNNER_TEMP/playwright-browsers"
          PLAYWRIGHT_BROWSERS_PATH="$download_dir" pnpm exec playwright install --with-deps chromium
          sudo cp -R --no-preserve=ownership "$download_dir" "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chmod -R go-w "$PLAYWRIGHT_BROWSERS_PATH"

          # Grant user namespaces only to the root-owned executable used by the worker tests.
          shells=("$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          [[ ${#shells[@]} == 1 && -x "${shells[0]}" && ! -w "${shells[0]}" ]]
          sudo apparmor_parser --replace <<PROFILE
          abi <abi/4.0>,
          profile xuti-ci-chromium "${shells[0]}" flags=(unconfined) {
            userns,
          }
          PROFILE
      - run: pnpm lint && pnpm typecheck && pnpm test:unit && pnpm build
      - run: pnpm test:integration
      - name: Verify cross-table transfer transactions and product archive
        run: SELECTION_TRANSFER_TEST_DATABASE_URL="$DATABASE_URL" pnpm exec tsx tests/integration/selection-transfer.ts
      - run: pnpm exec tsx tests/integration/project-library.ts
      - run: pnpm exec tsx tests/integration/supply.ts
      - run: pnpm test:e2e
