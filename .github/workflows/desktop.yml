name: Windows desktop
on:
  push:
    paths:
      [
        "apps/desktop/**",
        "scripts/*desktop*.mjs",
        "scripts/test-desktop-caption.ps1",
        "scripts/test-desktop-file-copy.*",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "apps/desktop/**",
        "scripts/*desktop*.mjs",
        "scripts/test-desktop-caption.ps1",
        "scripts/test-desktop-file-copy.*",
        ".github/workflows/desktop.yml",
      ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-desktop.mjs
      - run: pnpm build:desktop
      - name: Verify native title bar theme changes
        shell: powershell
        run: |
          $desktop = Get-Content -Raw .local/desktop-client-build/latest.json | ConvertFrom-Json
          ./scripts/test-desktop-caption.ps1 -Executable $desktop.executable
      - name: Verify Explorer copies fixture files with Ctrl+C and Ctrl+V
        shell: powershell
        timeout-minutes: 3
        env:
          XUTI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $desktop = Get-Content -Raw .local/desktop-client-build/latest.json | ConvertFrom-Json
          ./scripts/test-desktop-file-copy.ps1 -Executable $desktop.executable
      - uses: actions/upload-artifact@v4
        with:
          name: xuti-desktop-win-x64
          path: apps/desktop/release/xuti-desktop-win-x64.zip
